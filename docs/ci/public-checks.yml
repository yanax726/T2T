name: Public reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library calculator example
        run: ./run.sh demo
      - name: Test frozen EASI input validation
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_unified_bsa_three.py'

  public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install recorded Python environment
        run: python -m pip install -r requirements.lock.txt
      - name: Run public tests
        run: ./run.sh test

  aggregate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install numerical and TeX dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Rebuild public figures and manuscript
        run: ./run.sh rebuild
